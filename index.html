<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Function Solver Visualization (3D)</title>
    <!-- Load Plotly via CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1400px; margin: 0 auto; padding: 20px; color: #333; }
        h1 { border-bottom: 1px solid #eaeaea; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
        
        .layout { display: flex; gap: 30px; align-items: flex-start; }
        .sidebar { flex: 0 0 320px; background: #f8f9fa; padding: 20px; border-radius: 8px; box-sizing: border-box; }
        .main-content { flex: 1; min-width: 0; }
        
        .metrics-container { display: flex; justify-content: space-between; flex-wrap: wrap; padding: 20px 0 0 0; font-weight: bold; font-size: 1em; }
        .metric-block { display: flex; flex-direction: column; align-items: center; width: 16%; }
        .metric-label { font-size: 0.75em; color: #666; text-transform: uppercase; margin-bottom: 2px; text-align: center; }
        .metric-value { font-size: 1.3em; text-shadow: 0px 1px 1px rgba(0,0,0,0.1); margin-bottom: 2px; }
        .metric-chi { font-size: 0.75em; color: #888; font-weight: 500; }
        .metric-iters { font-size: 0.8em; color: #444; font-weight: 600; margin-top: 4px; background: #eee; padding: 2px 8px; border-radius: 12px; }
        
        .control-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
        input[type="range"], select { width: 100%; margin-bottom: 10px; padding: 5px; font-family: inherit; box-sizing: border-box; }
        
        .toggle-label { display: flex; align-items: center; cursor: pointer; font-size: 0.85em; margin-bottom: 8px; }
        .toggle-label input { margin-right: 8px; }
        
        hr { border: 0; border-top: 1px solid #e1e4e8; margin: 20px 0; }

        @media (max-width: 1000px) {
            .layout { flex-direction: column; }
            .sidebar { flex: auto; width: 100%; }
            .metric-block { width: 30%; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <h1>Cost Function Solver Visualization</h1>
    
    <div class="layout">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="control-group">
                <label>Dataset / Objective Function:</label>
                <select id="dataset" style="font-size: 14px; border-radius: 4px; padding: 6px;">
                    <option value="exp">Exponential Fit: y = a * exp(b * x)</option>
                    <option value="sine">Sine Wave Fit: y = sin(a * x + b)</option>
                </select>
            </div>

            <hr>

            <div class="control-group">
                <label>Start X: <span id="val-startx">3.0</span></label>
                <input type="range" id="startx" min="-5" max="5" step="0.1" value="3.0">
                
                <label>Start Y: <span id="val-starty">3.0</span></label>
                <input type="range" id="starty" min="-5" max="5" step="0.1" value="3.0">
                
                <label>Iteration Step: <span id="val-iter">20</span></label>
                <input type="range" id="iter" min="0" max="50" step="1" value="20">
            </div>

            <hr>

            <div class="control-group">
                <label>Initial LM Lambda: <span id="val-initlambda">1.0</span></label>
                <input type="range" id="initlambda" min="0.001" max="100" step="0.1" value="1.0">
                
                <label>GD Learning Rate: <span id="val-lr">0.050</span></label>
                <input type="range" id="lr" min="0.001" max="0.2" step="0.001" value="0.05">
            </div>

            <hr>

            <div class="control-group" style="margin-bottom: 0;">
                <label class="toggle-label"><input type="checkbox" id="show-gd" checked> Gradient Descent (Magenta)</label>
                <label class="toggle-label"><input type="checkbox" id="show-nw" checked> Newton (Orange)</label>
                <label class="toggle-label"><input type="checkbox" id="show-gn" checked> Gauss-Newton (Red)</label>
                <label class="toggle-label"><input type="checkbox" id="show-lm" checked> Lev-Marquardt (Cyan)</label>
                <label class="toggle-label" style="margin-bottom: 0;"><input type="checkbox" id="show-nm" checked> Nelder-Mead (Green)</label>
            </div>
        </div>

        <!-- RIGHT MAIN CONTENT -->
        <div class="main-content">
            <div id="plot"></div>

            <div class="metrics-container">
                <div class="metric-block">
                    <div class="metric-label">Initial Cost</div>
                    <div class="metric-value" id="val-initcost" style="color: black;">0.00</div>
                    <div class="metric-chi" id="chi-init">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" style="opacity: 0;">-</div> 
                </div>
                <div class="metric-block">
                    <div class="metric-label">GD Cost</div>
                    <div class="metric-value" id="val-gdcost" style="color: #FF00FF;">0.00</div>
                    <div class="metric-chi" id="chi-gd">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" id="iter-gd">Iters: -</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">Newton Cost</div>
                    <div class="metric-value" id="val-nwcost" style="color: #FFA500;">0.00</div>
                    <div class="metric-chi" id="chi-nw">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" id="iter-nw">Iters: -</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">GN Cost</div>
                    <div class="metric-value" id="val-gncost" style="color: #FF0000;">0.00</div>
                    <div class="metric-chi" id="chi-gn">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" id="iter-gn">Iters: -</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">LM Cost</div>
                    <div class="metric-value" id="val-lmcost" style="color: #0099FF;">0.00</div>
                    <div class="metric-chi" id="chi-lm">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" id="iter-lm">Iters: -</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">NM Cost</div>
                    <div class="metric-value" id="val-nmcost" style="color: #32CD32;">0.00</div>
                    <div class="metric-chi" id="chi-nm">(χ²_ν: 0.00)</div>
                    <div class="metric-iters" id="iter-nm">Iters: -</div>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- UTILITIES ---
    function formatNum(val) {
        if (!isFinite(val)) return "NaN";
        if (val === 0) return "0.00";
        if (Math.abs(val) >= 10000 || Math.abs(val) < 0.01) return val.toExponential(2);
        return val.toFixed(2);
    }
    
    function getDistance(p1, p2) {
        return Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
    }

    // --- MATH HELPERS FOR 2x2 MATRICES ---
    function invert2x2(A) {
        let det = A[0][0]*A[1][1] - A[0][1]*A[1][0];
        if (Math.abs(det) < 1e-9) throw new Error("Singular Matrix");
        return [ [A[1][1]/det, -A[0][1]/det], [-A[1][0]/det, A[0][0]/det] ];
    }
    function mul2x2Vec(A, v) { return [A[0][0]*v[0] + A[0][1]*v[1], A[1][0]*v[0] + A[1][1]*v[1]]; }
    function JTJ(J) {
        let res = [[0,0],[0,0]];
        for(let i=0; i<J.length; i++) {
            res[0][0] += J[i][0]*J[i][0]; res[0][1] += J[i][0]*J[i][1];
            res[1][0] += J[i][1]*J[i][0]; res[1][1] += J[i][1]*J[i][1];
        }
        return res;
    }
    function JT_res(J, r) {
        let out = [0,0];
        for(let i=0; i<J.length; i++) { out[0] += J[i][0]*r[i]; out[1] += J[i][1]*r[i]; }
        return out;
    }

    // --- DATA & DOMAIN STATE ---
    let currentDataset = 'exp';
    let x_data = [];
    let y_data = [];
    let true_a = 2.0;
    let true_b = 1.5;
    
    let noise_sigma = 0.1;
    let degrees_of_freedom = 1;

    function initDataset() {
        currentDataset = document.getElementById('dataset').value;
        const num_points = 100; 
        let seed = 42; 
        
        function getNoise(sigma) {
            let u1 = 0, u2 = 0;
            while(u1 === 0) {
                let x1 = Math.sin(seed++) * 10000; u1 = x1 - Math.floor(x1);
            }
            let x2 = Math.sin(seed++) * 10000; u2 = x2 - Math.floor(x2);
            return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * sigma;
        }

        if (currentDataset === 'exp') {
            true_a = 2.0; true_b = 1.5;
            noise_sigma = 0.10;
            x_data = Array.from({length: num_points}, (_, i) => i / (num_points - 1));
            y_data = x_data.map(x => true_a * Math.exp(true_b * x) + getNoise(noise_sigma));
            degrees_of_freedom = num_points - 2;
        } else {
            true_a = 3.0; true_b = 1.0;
            noise_sigma = 0.15; 
            x_data = Array.from({length: num_points}, (_, i) => (i / (num_points - 1)) * 4.0);
            y_data = x_data.map(x => Math.sin(true_a * x + true_b) + getNoise(noise_sigma));
            degrees_of_freedom = num_points - 2;
        }
    }
    initDataset();

    function getResiduals(p) { 
        if (currentDataset === 'exp') {
            return x_data.map((x, i) => p[0] * Math.exp(p[1] * x) - y_data[i]);
        } else {
            return x_data.map((x, i) => Math.sin(p[0] * x + p[1]) - y_data[i]);
        }
    }
    
    function getCost(p) { return 0.5 * getResiduals(p).reduce((sum, r) => sum + r*r, 0); }
    
    function getReducedChiSq(cost) {
        return (2.0 * cost) / (degrees_of_freedom * noise_sigma * noise_sigma);
    }
    
    function getJacobian(p) {
        if (currentDataset === 'exp') {
            return x_data.map(x => [Math.exp(p[1]*x), p[0]*x*Math.exp(p[1]*x)]);
        } else {
            return x_data.map(x => [x * Math.cos(p[0]*x + p[1]), Math.cos(p[0]*x + p[1])]);
        }
    }

    function getExactHessian(p) {
        let res = getResiduals(p);
        let J = getJacobian(p);
        let H = JTJ(J);
        for(let i=0; i<x_data.length; i++) {
            let x = x_data[i];
            if (currentDataset === 'exp') {
                let d2_ab = x * Math.exp(p[1]*x);
                let d2_bb = p[0] * x * x * Math.exp(p[1]*x);
                H[0][1] += res[i] * d2_ab;
                H[1][0] += res[i] * d2_ab;
                H[1][1] += res[i] * d2_bb;
            } else {
                let sin_val = Math.sin(p[0]*x + p[1]);
                let d2_aa = -x * x * sin_val;
                let d2_ab = -x * sin_val;
                let d2_bb = -sin_val;
                H[0][0] += res[i] * d2_aa;
                H[0][1] += res[i] * d2_ab;
                H[1][0] += res[i] * d2_ab;
                H[1][1] += res[i] * d2_bb;
            }
        }
        return H;
    }

    // --- GENERATE STATIC 3D SURFACE BACKGROUND ---
    const grid_size = 60;
    const a_range = Array.from({length: grid_size}, (_, i) => -5 + (10 * i / (grid_size - 1)));
    const b_range = Array.from({length: grid_size}, (_, i) => -5 + (10 * i / (grid_size - 1)));

    // --- MAIN UPDATE FUNCTION ---
    let isUpdating = false; 

    function updatePlot() {
        if (isUpdating) return;
        isUpdating = true;

        const Z_surface = [];
        for(let b of b_range) {
            let row = [];
            for(let a of a_range) {
                let cost = getCost([a, b]);
                if(!isFinite(cost)) cost = 1e10; 
                row.push(Math.log10(cost + 1e-6));
            }
            Z_surface.push(row);
        }

        let sx = parseFloat(document.getElementById('startx').value);
        let sy = parseFloat(document.getElementById('starty').value);
        let iters = parseInt(document.getElementById('iter').value);
        let init_lambda = parseFloat(document.getElementById('initlambda').value);
        let lr = parseFloat(document.getElementById('lr').value);

        document.getElementById('val-startx').innerText = sx.toFixed(1);
        document.getElementById('val-starty').innerText = sy.toFixed(1);
        document.getElementById('val-iter').innerText = iters;
        document.getElementById('val-initlambda').innerText = init_lambda.toFixed(2);
        document.getElementById('val-lr').innerText = lr.toFixed(3);

        let p_gd = [sx, sy], p_gn = [sx, sy], p_nw = [sx, sy], p_lm = [sx, sy];
        let path_gd = [p_gd], path_gn = [p_gn], path_nw = [p_nw], path_lm = [p_lm];
        
        // Nelder-Mead Initial Simplex
        let nm_simplex = [ [sx, sy], [sx + 0.5, sy], [sx, sy + 0.5] ];
        nm_simplex.sort((a, b) => getCost(a) - getCost(b));
        let p_nm = nm_simplex[0];
        let path_nm = [p_nm];

        let cur_lambda = init_lambda;

        // Convergence Tracking
        const TOL = 1e-4; 
        let done_gd = false, done_gn = false, done_nw = false, done_lm = false, done_nm = false;
        let conv_gd = iters, conv_gn = iters, conv_nw = iters, conv_lm = iters, conv_nm = iters;

        for(let i=0; i<iters; i++) {
            // Gradient Descent
            if (!done_gd) {
                let J_gd = getJacobian(p_gd), r_gd = getResiduals(p_gd);
                let grad_gd = JT_res(J_gd, r_gd);
                let p_next = [p_gd[0] - lr*grad_gd[0], p_gd[1] - lr*grad_gd[1]];
                if (getDistance(p_gd, p_next) < TOL) { done_gd = true; conv_gd = i + 1; }
                p_gd = p_next;
            }
            path_gd.push(p_gd);

            // Gauss-Newton
            if (!done_gn) {
                try {
                    let J_gn = getJacobian(p_gn), r_gn = getResiduals(p_gn);
                    let step_gn = mul2x2Vec(invert2x2(JTJ(J_gn)), JT_res(J_gn, r_gn));
                    let p_next = [p_gn[0] - step_gn[0], p_gn[1] - step_gn[1]];
                    if (getDistance(p_gn, p_next) < TOL) { done_gn = true; conv_gn = i + 1; }
                    p_gn = p_next;
                } catch(e) { done_gn = true; conv_gn = "Failed"; }
            }
            path_gn.push(p_gn);

            // Newton
            if (!done_nw) {
                try {
                    let J_nw = getJacobian(p_nw), r_nw = getResiduals(p_nw);
                    let step_nw = mul2x2Vec(invert2x2(getExactHessian(p_nw)), JT_res(J_nw, r_nw));
                    let p_next = [p_nw[0] - step_nw[0], p_nw[1] - step_nw[1]];
                    if (getDistance(p_nw, p_next) < TOL) { done_nw = true; conv_nw = i + 1; }
                    p_nw = p_next;
                } catch(e) { done_nw = true; conv_nw = "Failed"; }
            }
            path_nw.push(p_nw);

            // Levenberg-Marquardt
            if (!done_lm) {
                let J_lm = getJacobian(p_lm), r_lm = getResiduals(p_lm);
                let cost_lm = getCost(p_lm);
                let H_lm = JTJ(J_lm);
                H_lm[0][0] += cur_lambda * H_lm[0][0];
                H_lm[1][1] += cur_lambda * H_lm[1][1];
                
                try {
                    let step_lm = mul2x2Vec(invert2x2(H_lm), JT_res(J_lm, r_lm));
                    let p_try = [p_lm[0] - step_lm[0], p_lm[1] - step_lm[1]];
                    
                    if (getDistance(p_lm, p_try) < TOL) { done_lm = true; conv_lm = i + 1; }
                    
                    if(getCost(p_try) < cost_lm) {
                        p_lm = p_try;
                        cur_lambda /= 10.0;
                    } else {
                        cur_lambda *= 10.0;
                    }
                } catch(e) { cur_lambda *= 10.0; }
            }
            path_lm.push(p_lm);

            // Nelder-Mead
            if (!done_nm) {
                let centroid = [ (nm_simplex[0][0] + nm_simplex[1][0])/2.0, (nm_simplex[0][1] + nm_simplex[1][1])/2.0 ];
                let worst = nm_simplex[2];
                let ref = [ centroid[0] + 1.0*(centroid[0] - worst[0]), centroid[1] + 1.0*(centroid[1] - worst[1]) ];
                let cost_ref = getCost(ref);
                let cost_best = getCost(nm_simplex[0]);
                let cost_good = getCost(nm_simplex[1]);
                let cost_worst = getCost(nm_simplex[2]);

                if (cost_ref >= cost_best && cost_ref < cost_good) {
                    nm_simplex[2] = ref;
                } else if (cost_ref < cost_best) {
                    let exp = [ centroid[0] + 2.0*(ref[0] - centroid[0]), centroid[1] + 2.0*(ref[1] - centroid[1]) ];
                    if (getCost(exp) < cost_ref) nm_simplex[2] = exp;
                    else nm_simplex[2] = ref;
                } else {
                    let contracted = false;
                    if (cost_ref < cost_worst) {
                        let cont = [ centroid[0] + 0.5*(ref[0] - centroid[0]), centroid[1] + 0.5*(ref[1] - centroid[1]) ];
                        if (getCost(cont) <= cost_ref) { nm_simplex[2] = cont; contracted = true; }
                    } else {
                        let cont = [ centroid[0] + 0.5*(worst[0] - centroid[0]), centroid[1] + 0.5*(worst[1] - centroid[1]) ];
                        if (getCost(cont) < cost_worst) { nm_simplex[2] = cont; contracted = true; }
                    }
                    if (!contracted) {
                        nm_simplex[1] = [ nm_simplex[0][0] + 0.5*(nm_simplex[1][0] - nm_simplex[0][0]), nm_simplex[0][1] + 0.5*(nm_simplex[1][1] - nm_simplex[0][1]) ];
                        nm_simplex[2] = [ nm_simplex[0][0] + 0.5*(nm_simplex[2][0] - nm_simplex[0][0]), nm_simplex[0][1] + 0.5*(nm_simplex[2][1] - nm_simplex[0][1]) ];
                    }
                }
                nm_simplex.sort((a, b) => getCost(a) - getCost(b));
                let p_next = nm_simplex[0];
                if (getDistance(p_nm, p_next) < TOL) { done_nm = true; conv_nm = i + 1; }
                p_nm = p_next;
            }
            path_nm.push(p_nm);
        }

        // 5. UPDATE METRICS UI
        let cost_init = getCost([sx, sy]);
        let cost_gd = getCost(p_gd);
        let cost_nw = getCost(p_nw);
        let cost_gn = getCost(p_gn);
        let cost_lm = getCost(p_lm);
        let cost_nm = getCost(p_nm);

        document.getElementById('val-initcost').innerText = formatNum(cost_init);
        document.getElementById('val-gdcost').innerText = formatNum(cost_gd);
        document.getElementById('val-nwcost').innerText = formatNum(cost_nw);
        document.getElementById('val-gncost').innerText = formatNum(cost_gn);
        document.getElementById('val-lmcost').innerText = formatNum(cost_lm);
        document.getElementById('val-nmcost').innerText = formatNum(cost_nm);

        document.getElementById('chi-init').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_init))})`;
        document.getElementById('chi-gd').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_gd))})`;
        document.getElementById('chi-nw').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_nw))})`;
        document.getElementById('chi-gn').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_gn))})`;
        document.getElementById('chi-lm').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_lm))})`;
        document.getElementById('chi-nm').innerText = `(χ²_ν: ${formatNum(getReducedChiSq(cost_nm))})`;

        // Update Convergence Texts
        document.getElementById('iter-gd').innerText = done_gd ? `Iters: ${conv_gd}` : `Iters: ${iters}+`;
        document.getElementById('iter-nw').innerText = (done_nw && conv_nw !== "Failed") ? `Iters: ${conv_nw}` : (conv_nw === "Failed" ? "Failed" : `Iters: ${iters}+`);
        document.getElementById('iter-gn').innerText = (done_gn && conv_gn !== "Failed") ? `Iters: ${conv_gn}` : (conv_gn === "Failed" ? "Failed" : `Iters: ${iters}+`);
        document.getElementById('iter-lm').innerText = done_lm ? `Iters: ${conv_lm}` : `Iters: ${iters}+`;
        document.getElementById('iter-nm').innerText = done_nm ? `Iters: ${conv_nm}` : `Iters: ${iters}+`;

        // 6. BUILD 3D TRACES
        let traces = [];
        
        // 3D Surface Background
        traces.push({
            z: Z_surface, x: a_range, y: b_range, type: 'surface',
            colorscale: 'Viridis', opacity: 0.8, showscale: false, hoverinfo: 'skip'
        });

        function make3DPath(path, name, color) {
            return {
                type: 'scatter3d', mode: 'lines+markers', name: name,
                x: path.map(p => p[0]), y: path.map(p => p[1]), z: path.map(p => Math.log10(getCost(p) + 1e-6) + 0.1),
                line: {color: color, width: 4}, marker: {color: color, size: 4}
            };
        }

        if(document.getElementById('show-gd').checked) traces.push(make3DPath(path_gd, 'Gradient Descent', '#FF00FF'));
        if(document.getElementById('show-nw').checked) traces.push(make3DPath(path_nw, 'Newton', '#FFA500'));
        if(document.getElementById('show-gn').checked) traces.push(make3DPath(path_gn, 'Gauss-Newton', '#FF0000'));
        if(document.getElementById('show-lm').checked) traces.push(make3DPath(path_lm, 'Levenberg-Marquardt', '#0099FF'));
        if(document.getElementById('show-nm').checked) traces.push(make3DPath(path_nm, 'Nelder-Mead', '#32CD32'));
        
        traces.push({
            type: 'scatter3d', mode: 'markers', name: 'True Minimum', showlegend: true, hoverinfo: 'skip',
            x: [true_a], y: [true_b], z: [Math.log10(getCost([true_a, true_b]) + 1e-6) + 0.1],
            marker: {color: 'red', size: 6, symbol: 'cross'}
        });

        traces.push({
            type: 'scatter3d', mode: 'markers', name: 'Starting Point', showlegend: true,
            x: [sx], y: [sy], z: [Math.log10(getCost([sx, sy]) + 1e-6) + 0.1],
            marker: {color: 'black', size: 6, symbol: 'circle'}
        });

        // 7. RENDER 3D PLOT
        Plotly.react('plot', traces, {
            uirevision: currentDataset, // Freezes camera panning/zoom across all standard UI updates!
            height: 650, margin: {l: 0, r: 0, t: 0, b: 0},
            scene: {
                xaxis: {title: 'X Position (a)', range: [-5, 5]},
                yaxis: {title: 'Y Position (b)', range: [-5, 5]},
                zaxis: {title: 'Log10(Cost)', range: [-1.5, 6]} // Capped Z-axis to stop jumping
            },
            legend: {orientation: 'h', y: -0.1},
            plot_bgcolor: 'white'
        }, {responsive: true}).then(() => {
            isUpdating = false;
        });
    }

    document.getElementById('dataset').addEventListener('change', function() {
        initDataset();
        updatePlot();
    });

    document.querySelectorAll('input').forEach(el => el.addEventListener('input', updatePlot));
    
    // Initial draw
    updatePlot();

</script>
</body>
</html>
