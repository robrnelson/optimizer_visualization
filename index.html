<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Function Solver Visualization</title>
    <!-- Load Plotly via CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; color: #333; }
        h1 { border-bottom: 1px solid #eaeaea; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
        
        .layout { display: flex; gap: 30px; align-items: flex-start; }
        .sidebar { flex: 0 0 320px; background: #f8f9fa; padding: 20px; border-radius: 8px; box-sizing: border-box; }
        .main-content { flex: 1; min-width: 0; }
        
        .metrics-container { display: flex; justify-content: space-around; flex-wrap: wrap; padding: 20px 0 0 0; font-weight: bold; font-size: 1em; }
        .metric-block { display: flex; flex-direction: column; align-items: center; }
        .metric-label { font-size: 0.75em; color: #666; text-transform: uppercase; margin-bottom: 2px; }
        .metric-value { font-size: 1.4em; text-shadow: 0px 1px 1px rgba(0,0,0,0.1); margin-bottom: 2px; }
        .metric-chi { font-size: 0.75em; color: #888; font-weight: 500; }
        
        .control-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 500; font-size: 0.9em; }
        input[type="range"], select { width: 100%; margin-bottom: 10px; padding: 5px; font-family: inherit; box-sizing: border-box; }
        
        .toggle-label { display: flex; align-items: center; cursor: pointer; font-size: 0.9em; margin-bottom: 10px; }
        .toggle-label input { margin-right: 8px; }
        
        hr { border: 0; border-top: 1px solid #e1e4e8; margin: 20px 0; }

        @media (max-width: 850px) {
            .layout { flex-direction: column; }
            .sidebar { flex: auto; width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Cost Function Solver Visualization</h1>
    
    <div class="layout">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="control-group">
                <label>Dataset / Objective Function:</label>
                <select id="dataset" style="font-size: 14px; border-radius: 4px; padding: 6px;">
                    <option value="exp">Exponential Fit: y = a * exp(b * x)</option>
                    <option value="sine">Sine Wave Fit: y = sin(a * x + b)</option>
                </select>
            </div>

            <hr>

            <div class="control-group">
                <label>Start X: <span id="val-startx">3.0</span></label>
                <input type="range" id="startx" min="-5" max="5" step="0.1" value="3.0">
                
                <label>Start Y: <span id="val-starty">3.0</span></label>
                <input type="range" id="starty" min="-5" max="5" step="0.1" value="3.0">
                
                <label>Iteration Step: <span id="val-iter">20</span></label>
                <input type="range" id="iter" min="0" max="20" step="1" value="20">
            </div>

            <hr>

            <div class="control-group">
                <label>Initial LM Lambda: <span id="val-initlambda">1.0</span></label>
                <input type="range" id="initlambda" min="0.001" max="100" step="0.1" value="1.0">
                
                <label>GD Learning Rate: <span id="val-lr">0.050</span></label>
                <input type="range" id="lr" min="0.001" max="0.2" step="0.001" value="0.05">
            </div>

            <hr>

            <div class="control-group" style="margin-bottom: 0;">
                <label class="toggle-label"><input type="checkbox" id="show-nw" checked> Newton</label>
                <label class="toggle-label"><input type="checkbox" id="show-gn" checked> Gauss-Newton</label>
                <label class="toggle-label"><input type="checkbox" id="show-lm" checked> Levenberg-Marquardt</label>
                <label class="toggle-label" style="margin-bottom: 0;"><input type="checkbox" id="show-gd" checked> Gradient Descent</label>
            </div>
        </div>

        <!-- RIGHT MAIN CONTENT -->
        <div class="main-content">
            <div id="plot"></div>

            <div class="metrics-container">
                <div class="metric-block">
                    <div class="metric-label">Initial Cost</div>
                    <div class="metric-value" id="val-initcost" style="color: black;">0.00</div>
                    <div class="metric-chi" id="chi-init">(χ²_ν: 0.00)</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">GD Cost</div>
                    <div class="metric-value" id="val-gdcost" style="color: #FF00FF;">0.00</div>
                    <div class="metric-chi" id="chi-gd">(χ²_ν: 0.00)</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">Newton Cost</div>
                    <div class="metric-value" id="val-nwcost" style="color: #FFA500;">0.00</div>
                    <div class="metric-chi" id="chi-nw">(χ²_ν: 0.00)</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">GN Cost</div>
                    <div class="metric-value" id="val-gncost" style="color: #FF0000;">0.00</div>
                    <div class="metric-chi" id="chi-gn">(χ²_ν: 0.00)</div>
                </div>
                <div class="metric-block">
                    <div class="metric-label">LM Cost</div>
                    <div class="metric-value" id="val-lmcost" style="color: #008B8B;">0.00</div>
                    <div class="metric-chi" id="chi-lm">(χ²_ν: 0.00)</div>
                </div>
            </div>
        </div>
    </div>

<script>
    // --- MATH HELPERS FOR 2x2 MATRICES ---
    function invert2x2(A) {
        let det = A[0][0]*A[1][1] - A[0][1]*A[1][0];
        if (Math.abs(det) < 1e-9) throw new Error("Singular Matrix");
        return [ [A[1][1]/det, -A[0][1]/det], [-A[1][0]/det, A[0][0]/det] ];
    }
    function mul2x2Vec(A, v) { return [A[0][0]*v[0] + A[0][1]*v[1], A[1][0]*v[0] + A[1][1]*v[1]]; }
    function JTJ(J) {
        let res = [[0,0],[0,0]];
        for(let i=0; i<J.length; i++) {
            res[0][0] += J[i][0]*J[i][0]; res[0][1] += J[i][0]*J[i][1];
            res[1][0] += J[i][1]*J[i][0]; res[1][1] += J[i][1]*J[i][1];
        }
        return res;
    }
    function JT_res(J, r) {
        let out = [0,0];
        for(let i=0; i<J.length; i++) { out[0] += J[i][0]*r[i]; out[1] += J[i][1]*r[i]; }
        return out;
    }

    // --- DATA & DOMAIN STATE ---
    let currentDataset = 'exp';
    let x_data = [];
    let y_data = [];
    let true_a = 2.0;
    let true_b = 1.5;
    
    let noise_sigma = 0.1;
    let degrees_of_freedom = 1;

    function initDataset() {
        currentDataset = document.getElementById('dataset').value;
        const num_points = 100; // Increased sample size to 100
        let seed = 42; 
        
        // Deterministic Box-Muller transform for true Gaussian noise
        function getNoise(sigma) {
            let u1 = 0, u2 = 0;
            while(u1 === 0) {
                let x1 = Math.sin(seed++) * 10000; u1 = x1 - Math.floor(x1);
            }
            let x2 = Math.sin(seed++) * 10000; u2 = x2 - Math.floor(x2);
            return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * sigma;
        }

        if (currentDataset === 'exp') {
            true_a = 2.0; true_b = 1.5;
            noise_sigma = 0.10;
            x_data = Array.from({length: num_points}, (_, i) => i / (num_points - 1));
            y_data = x_data.map(x => true_a * Math.exp(true_b * x) + getNoise(noise_sigma));
            degrees_of_freedom = num_points - 2;
        } else {
            true_a = 3.0; true_b = 1.0;
            noise_sigma = 0.15; 
            x_data = Array.from({length: num_points}, (_, i) => (i / (num_points - 1)) * 4.0);
            y_data = x_data.map(x => Math.sin(true_a * x + true_b) + getNoise(noise_sigma));
            degrees_of_freedom = num_points - 2;
        }
    }
    initDataset();

    function getResiduals(p) { 
        if (currentDataset === 'exp') {
            return x_data.map((x, i) => p[0] * Math.exp(p[1] * x) - y_data[i]);
        } else {
            return x_data.map((x, i) => Math.sin(p[0] * x + p[1]) - y_data[i]);
        }
    }
    
    function getCost(p) { return 0.5 * getResiduals(p).reduce((sum, r) => sum + r*r, 0); }
    
    function getReducedChiSq(cost) {
        return (2.0 * cost) / (degrees_of_freedom * noise_sigma * noise_sigma);
    }
    
    function getJacobian(p) {
        if (currentDataset === 'exp') {
            return x_data.map(x => [Math.exp(p[1]*x), p[0]*x*Math.exp(p[1]*x)]);
        } else {
            return x_data.map(x => [x * Math.cos(p[0]*x + p[1]), Math.cos(p[0]*x + p[1])]);
        }
    }

    function getExactHessian(p) {
        let res = getResiduals(p);
        let J = getJacobian(p);
        let H = JTJ(J);
        for(let i=0; i<x_data.length; i++) {
            let x = x_data[i];
            if (currentDataset === 'exp') {
                let d2_ab = x * Math.exp(p[1]*x);
                let d2_bb = p[0] * x * x * Math.exp(p[1]*x);
                H[0][1] += res[i] * d2_ab;
                H[1][0] += res[i] * d2_ab;
                H[1][1] += res[i] * d2_bb;
            } else {
                let sin_val = Math.sin(p[0]*x + p[1]);
                let d2_aa = -x * x * sin_val;
                let d2_ab = -x * sin_val;
                let d2_bb = -sin_val;
                H[0][0] += res[i] * d2_aa;
                H[0][1] += res[i] * d2_ab;
                H[1][0] += res[i] * d2_ab;
                H[1][1] += res[i] * d2_bb;
            }
        }
        return H;
    }

    // --- MAIN UPDATE FUNCTION ---
    let isUpdating = false; 
    let isProgrammaticUpdate = false; 
    let forceReset = false;

    function updatePlot() {
        if (isUpdating) return;
        isUpdating = true;

        let plotDiv = document.getElementById('plot');
        
        let currentXRange = [-5, 5];
        let currentYRange = [-5, 5];
        let currentDragMode = 'zoom';
        
        if (plotDiv.layout && !forceReset) {
            if (plotDiv.layout.xaxis && plotDiv.layout.xaxis.range) {
                currentXRange = plotDiv.layout.xaxis.range;
                currentYRange = plotDiv.layout.yaxis.range;
            }
            if (plotDiv.layout.dragmode) {
                currentDragMode = plotDiv.layout.dragmode;
            }
        }
        forceReset = false;

        const grid_size = 80;
        const x_min = currentXRange[0];
        const x_max = currentXRange[1];
        const y_min = currentYRange[0];
        const y_max = currentYRange[1];
        
        const a_range = Array.from({length: grid_size}, (_, i) => x_min + ((x_max - x_min) * i / (grid_size - 1)));
        const b_range = Array.from({length: grid_size}, (_, i) => y_min + ((y_max - y_min) * i / (grid_size - 1)));

        const Z = [];
        for(let b of b_range) {
            let row = [];
            for(let a of a_range) {
                let cost = getCost([a, b]);
                if(!isFinite(cost)) cost = 1e10; 
                row.push(Math.log10(cost + 1e-6));
            }
            Z.push(row);
        }

        let sx = parseFloat(document.getElementById('startx').value);
        let sy = parseFloat(document.getElementById('starty').value);
        let iters = parseInt(document.getElementById('iter').value);
        let init_lambda = parseFloat(document.getElementById('initlambda').value);
        let lr = parseFloat(document.getElementById('lr').value);

        document.getElementById('val-startx').innerText = sx.toFixed(1);
        document.getElementById('val-starty').innerText = sy.toFixed(1);
        document.getElementById('val-iter').innerText = iters;
        document.getElementById('val-initlambda').innerText = init_lambda.toFixed(2);
        document.getElementById('val-lr').innerText = lr.toFixed(3);

        let p_gd = [sx, sy], p_gn = [sx, sy], p_nw = [sx, sy], p_lm = [sx, sy];
        let path_gd = [p_gd], path_gn = [p_gn], path_nw = [p_nw], path_lm = [p_lm];
        let cur_lambda = init_lambda;

        for(let i=0; i<iters; i++) {
            // GD
            let J_gd = getJacobian(p_gd), r_gd = getResiduals(p_gd);
            let grad_gd = JT_res(J_gd, r_gd);
            p_gd = [p_gd[0] - lr*grad_gd[0], p_gd[1] - lr*grad_gd[1]];
            path_gd.push(p_gd);

            // GN
            try {
                let J_gn = getJacobian(p_gn), r_gn = getResiduals(p_gn);
                let step_gn = mul2x2Vec(invert2x2(JTJ(J_gn)), JT_res(J_gn, r_gn));
                p_gn = [p_gn[0] - step_gn[0], p_gn[1] - step_gn[1]];
            } catch(e) {}
            path_gn.push(p_gn);

            // Newton
            try {
                let J_nw = getJacobian(p_nw), r_nw = getResiduals(p_nw);
                let step_nw = mul2x2Vec(invert2x2(getExactHessian(p_nw)), JT_res(J_nw, r_nw));
                p_nw = [p_nw[0] - step_nw[0], p_nw[1] - step_nw[1]];
            } catch(e) {}
            path_nw.push(p_nw);

            // LM
            let J_lm = getJacobian(p_lm), r_lm = getResiduals(p_lm);
            let cost_lm = getCost(p_lm);
            let H_lm = JTJ(J_lm);
            H_lm[0][0] += cur_lambda * H_lm[0][0];
            H_lm[1][1] += cur_lambda * H_lm[1][1];
            
            try {
                let step_lm = mul2x2Vec(invert2x2(H_lm), JT_res(J_lm, r_lm));
                let p_try = [p_lm[0] - step_lm[0], p_lm[1] - step_lm[1]];
                if(getCost(p_try) < cost_lm) {
                    p_lm = p_try;
                    cur_lambda /= 10.0;
                } else {
                    cur_lambda *= 10.0;
                }
            } catch(e) { cur_lambda *= 10.0; }
            path_lm.push(p_lm);
        }

        // 5. UPDATE METRICS UI
        let cost_init = getCost([sx, sy]);
        let cost_gd = getCost(p_gd);
        let cost_nw = getCost(p_nw);
        let cost_gn = getCost(p_gn);
        let cost_lm = getCost(p_lm);

        document.getElementById('val-initcost').innerText = cost_init.toExponential(2);
        document.getElementById('val-gdcost').innerText = cost_gd.toExponential(2);
        document.getElementById('val-nwcost').innerText = cost_nw.toExponential(2);
        document.getElementById('val-gncost').innerText = cost_gn.toExponential(2);
        document.getElementById('val-lmcost').innerText = cost_lm.toExponential(2);

        document.getElementById('chi-init').innerText = `(χ²_ν: ${getReducedChiSq(cost_init).toExponential(2)})`;
        document.getElementById('chi-gd').innerText = `(χ²_ν: ${getReducedChiSq(cost_gd).toFixed(2)})`;
        document.getElementById('chi-nw').innerText = `(χ²_ν: ${getReducedChiSq(cost_nw).toFixed(2)})`;
        document.getElementById('chi-gn').innerText = `(χ²_ν: ${getReducedChiSq(cost_gn).toFixed(2)})`;
        document.getElementById('chi-lm').innerText = `(χ²_ν: ${getReducedChiSq(cost_lm).toFixed(2)})`;

        // 6. BUILD TRACES
        let traces = [];
        
        traces.push({
            z: Z, x: a_range, y: b_range, type: 'contour', contours: {coloring: 'fill'},
            colorscale: 'Viridis', opacity: 0.75, showscale: false, ncontours: 60, hoverinfo: 'skip'
        });

        if(document.getElementById('show-gd').checked) traces.push({x: path_gd.map(p=>p[0]), y: path_gd.map(p=>p[1]), mode: 'lines+markers', name: 'Gradient Descent', line: {color: '#FF00FF', dash: 'dot', width: 2}});
        if(document.getElementById('show-nw').checked) traces.push({x: path_nw.map(p=>p[0]), y: path_nw.map(p=>p[1]), mode: 'lines+markers', name: 'Newton', line: {color: '#FFA500', width: 2}});
        if(document.getElementById('show-gn').checked) traces.push({x: path_gn.map(p=>p[0]), y: path_gn.map(p=>p[1]), mode: 'lines+markers', name: 'Gauss-Newton', line: {color: '#FF0000', dash: 'dash', width: 2}});
        if(document.getElementById('show-lm').checked) traces.push({x: path_lm.map(p=>p[0]), y: path_lm.map(p=>p[1]), mode: 'lines+markers', name: 'Levenberg-Marquardt', line: {color: '#00E5FF', width: 2}});
        
        traces.push({
            x: [true_a], y: [true_b], mode: 'markers', name: 'True Minimum', 
            showlegend: true, hoverinfo: 'skip', 
            marker: {color: 'white', size: 12, line: {color: 'red', width: 2}}
        });

        traces.push({
            x: [sx], y: [sy], mode: 'markers', name: 'Starting Point', 
            marker: {color: 'black', size: 10, line: {color: 'white', width: 1}}, 
            showlegend: true
        });

        // 7. RENDER PLOT 
        isProgrammaticUpdate = true; 
        Plotly.react('plot', traces, {
            height: 550, margin: {l: 40, r: 20, t: 20, b: 40},
            xaxis: {title: 'X Position →', range: currentXRange},
            yaxis: {title: 'Y Position ↑', range: currentYRange},
            legend: {orientation: 'h', y: -0.15},
            plot_bgcolor: 'white',
            dragmode: currentDragMode
        }, {responsive: true}).then(() => {
            isUpdating = false;
            setTimeout(() => { isProgrammaticUpdate = false; }, 50);
        });
    }

    document.getElementById('dataset').addEventListener('change', function() {
        initDataset();
        forceReset = true; 
        updatePlot();
    });

    document.querySelectorAll('input').forEach(el => el.addEventListener('input', updatePlot));
    
    updatePlot();

    let relayoutTimer;
    document.getElementById('plot').on('plotly_relayout', function(eventData) {
        if (isProgrammaticUpdate) return;
        if (eventData.dragmode && Object.keys(eventData).length === 1) return;
        clearTimeout(relayoutTimer);
        relayoutTimer = setTimeout(() => { updatePlot(); }, 400);
    });
</script>
</body>
</html>
